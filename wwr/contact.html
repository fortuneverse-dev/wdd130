<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | RiverNest Rafting</title>

    <meta name="description"
      content="Contact RiverNest Rafting to ask questions, plan your rafting adventure, and learn more about our exciting whitewater rafting experiences.">

    <meta name="author" content="Daphcar Fortune">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/raftinglogo.webp"
          alt="Rafting company logo featuring paddles, a whitewater raft, and rafters" width="128"
          height="128">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>RiverNest Rafting</h1>
        <p>123 Main River Street</p>
        <p>Kolob, California</p>
        <p>+1 999 999 9999</p>
        <p>info@rivernestrafting.com</p>

        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24873202.89653156!2d-146.42578125!3d40.44694705960048!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x874563b57606fd85%3A0x67de69ad4dbb01d2!2sDinosaur%20River%20Expeditions!5e0!3m2!1sfr!2sdo!4v1790901536519!5m2!1sfr!2sdo"
          width="400" height="250" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <form>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" placeholder="Your name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Your email" required>
            <fieldset>
                <legend>Message Purpose</legend>

                <input type="radio" id="general" name="purpose" value="general">
                <label for="general">General Inquiry</label>

                <input type="radio" id="reservation" name="purpose" value="reservation">
                <label for="reservation">Reservation Question</label>

                <input type="radio" id="suggestion" name="purpose" value="suggestion">
                <label for="suggestion">Website Suggestion</label>
            </fieldset>
            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Type here"></textarea>

            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">
                Please subscribe me to the monthly newsletter
            </label>

            <button type="submit">Get in Touch!</button>
        </form>
        <section>
            <div class="adventure-gallery">
                <h1>We Are Here to Serve You</h1>

                <figure>
                    <img src="images/emp-profile's-clara.webp" alt="Employee profile " width="128"
                      height="128">

                    <figcaption>
                        Senior Rafting Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/emp-profile's-briam.webp" alt="Employee profile" width="128"
                      height="128">

                    <figcaption>
                        Safety Officer
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/emp-profile's-ana (1).webp" alt="Employee profile" width="128"
                      height="128">

                    <figcaption>
                        Operations Manager
                    </figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg.jpg" alt="Facebook Icon" width="25" height="25">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg.jpg" alt="LinkedIn Icon" width="25" height="25">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg.webp" alt="Instagram Icon" width="25" height="25">
            </a>
        </nav>

        <p>&copy; 2026 RiverNest Rafting | Daphcar Fortune</p>

    </footer>

</body>

</html>
